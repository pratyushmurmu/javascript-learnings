<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 2025 Dhurandhar </title>
</head>
<body style="background-color: #F0FFFF; position:absolute; color: #00FFFF; padding: 60px;">
    <ul class="language">
        <li> JavaScript</li>
    </ul>
</body>
<script style="background-color: #F0FFFF; color: #00FFFF; position: absolute; padding: 60px;">
    function addLang(langName){
       const li = document.createElement('li')
       li.innerHTML = `${langName}`
       document.querySelector('.language').appendChild(li)
    }    
    addLang("python");
    addLang("java")
    addLang("typescript")

    function addOptiLanguage(langName){
        const li= document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addOptiLanguage('golang')

    //Edit 
    const secLang = document.querySelector("li:nth-child(2)") //There should be NO space between : and nth-child.Because of that space, the selector becomes invalid
    console.log(secLang);
    
    //secLang.innerHTML = "Mojo"
    const newLi = document.createElement('li')
    newLi.textContent = "Mojo"
    secLang.replaceWith(newLi)

    //edit
    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = '<li>typescript</li>'

    //Remove
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()
</script>
</html>
